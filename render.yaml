services:
  - type: web
    name: shree-annapure-instagram-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: META_VERIFY_TOKEN
        sync: false
      - key: META_PAGE_ACCESS_TOKEN
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: INSTAGRAM_BUSINESS_ACCOUNT_ID
        sync: false
